name: CD
on: 
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

jobs: 
  terraform-infra:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/infra
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v3
        with: 
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
      - name: init
        run: terraform init -input=false
      - name: plan
        run: terraform plan -out=tfplan -input=false
      - name: apply
        run: terraform apply -input=false tfplan
  
  terraform-platform:
    needs: [terraform-infra]
    runs-on: ubuntu-latest
    env:
      TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
    defaults:
      run:
        working-directory: terraform/platform
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: google-github-actions/auth@v3
        with: 
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: dasmeta
          location: europe-west1-b
          project_id: dasmeta-task
          context_name: gke_dasmeta-task_europe-west1-b_dasmeta
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
      - name: init
        run: terraform init -input=false
      - name: plan
        run: terraform plan -out=tfplan -input=false  -var "kubeconfig_path=$KUBECONFIG"
      - name: apply
        run: terraform apply -input=false tfplan