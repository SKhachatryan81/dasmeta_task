name: Destroy

on: 
  workflow_dispatch:
    inputs:
      confirm:
        description: 'type "destroy" to proceed'
        required: true


permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  destroy-platform:
    if: ${{ inputs.confirm == 'destroy' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/platform
    env:
      TF_VAR_slack_webhook_url: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: dasmeta
          location: europe-west1-b
          project_id: dasmeta-task
          context_name: gke_dasmeta-task_europe-west1-b_dasmeta
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
      - name: init
        run: terraform init -input=false
      - name: destroy
        run: terraform destroy -auto-approve -input=false
      - name: delete leftover disks (PVCs)
        run: |
          kubectl delete pvc --all -n monitoring --ignore-not-found --wait=true --timeout=180s
          kubectl wait pv --all --for=delete --timeout=180s || true
  
  destroy-infra:
    runs-on: ubuntu-latest
    needs: [destroy-platform]
    defaults:
      run:
        working-directory: terraform/infra
    steps:
      - uses: actions/checkout@v5
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.6
          terraform_wrapper: false
      - name: init
        run: terraform init -input=false
      - name: wait for load balancer to be released
        run: |
          ip=$(terraform output -raw ingress_ip 2>/dev/null || true)
          [ -z "$ip" ] && exit 0
          for i in $(seq 1 30); do
            n=$(gcloud compute forwarding-rules list --project dasmeta-task \
                  --filter="IPAddress=$ip" --format='value(name)' | wc -l)
            [ "$n" -eq 0 ] && echo "load balancer released" && exit 0
            echo "still in use ($i/30)…"; sleep 10
          done
          echo "load balancer still holds $ip after 5 minutes"; exit 1
      - name: destroy
        run: terraform destroy -auto-approve -input=false