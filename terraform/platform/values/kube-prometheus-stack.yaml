alertmanager:
  enabled: true
  fig:
    route:
      receiver: slack
      group_by: [alertname, namespace]
      group_wait: 30s       # wait to batch alerts that fire together
      group_interval: 5m
      repeat_interval: 4h   # re-send if still firing
    receivers:
    - name: "null"
    - name: slack
      slack_configs:
      - channel: "#alerts"
        send_resolved: true
        title: '{{ .Status | toUpper }}: {{ .CommonLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ "\n" }}{{ end }}'

# Not needed for this setup
defaultRules:
  create: false

# GKE runs these control-plane parts itself; they can't be scraped
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 2d
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        cpu: 100m
        memory: 400Mi
      limits:
        memory: 1Gi

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      memory: 128Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

prometheus-node-exporter:
  resources:
    requests:
      cpu: 10m
      memory: 24Mi
    limits:
      memory: 64Mi

grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    # hosts set from Terraform: grafana.<ingress-ip>.sslip.io
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 256Mi
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://loki.monitoring.svc.cluster.local:3100

additionalPrometheusRulesMap:
  node-alerts:
    groups:
    - name: nodes
      rules:
      - alert: NodeHighCPU
        expr: 1 - avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) > 0.8
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'High CPU on {{ $labels.instance }}: {{ $value | humanizePercentage }}'
      - alert: NodeHighMemory
        expr: 1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes > 0.85
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: 'High memory on {{ $labels.instance }}: {{ $value | humanizePercentage }}'