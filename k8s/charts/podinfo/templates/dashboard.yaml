# Picked up by the Grafana sidecar (kube-prometheus-stack) via the grafana_dashboard label
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-dashboard
  labels:
    appName: {{ .Values.app.name }}
    grafana_dashboard: "1"
data:
  podinfo.json: |-
    {
      "title": "podinfo",
      "uid": "podinfo",
      "schemaVersion": 39,
      "time": { "from": "now-1h", "to": "now" },
      "refresh": "30s",
      "panels": [
        {
          "type": "timeseries",
          "title": "CPU usage (cores)",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "short" } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"{{ .Release.Namespace }}\", container=\"{{ .Values.app.name }}\"}[5m]))",
              "legendFormat": "{{"{{"}}pod{{"}}"}}"
            }
          ]
        },
        {
          "type": "timeseries",
          "title": "Memory usage",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "fieldConfig": { "defaults": { "unit": "bytes" } },
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"{{ .Release.Namespace }}\", container=\"{{ .Values.app.name }}\"})",
              "legendFormat": "{{"{{"}}pod{{"}}"}}"
            }
          ]
        },
        {
          "type": "logs",
          "title": "Application logs",
          "gridPos": { "x": 0, "y": 8, "w": 24, "h": 12 },
          "datasource": { "type": "loki", "uid": "loki" },
          "options": { "showTime": true, "wrapLogMessage": true, "sortOrder": "Descending" },
          "targets": [
            {
              "refId": "A",
              "expr": "{namespace=\"{{ .Release.Namespace }}\", app=\"{{ .Values.app.name }}\"}"
            }
          ]
        }
      ]
    }
